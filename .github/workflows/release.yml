name: release
# Publishes the production image when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must equal the version in every package.json. The image is built exactly as CI builds it, must pass the
# empty-workspace smoke test, and is then pushed to ghcr.io/elitekaycy/qkt-backtester as :v0.2.0, :v0.2, :latest and
# :sha-<commit>. docs/production.md explains how to run it.
on:
  push: { tags: ["v*.*.*"] }
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/qkt-backtester
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the tag is the version in every package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in package.json packages/*/package.json; do
            V=$(node -p "require('./$f').version")
            [ "$V" = "$TAG" ] || { echo "::error file=$f::version $V does not match tag v$TAG"; exit 1; }
          done
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          echo "MINOR=$(echo "$TAG" | cut -d. -f1-2)" >> "$GITHUB_ENV"
          echo "SHORT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: "build the image (linux/amd64, as the qkt engine image is amd64 only)"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: qkt-backtester:release
          build-args: |
            STUDIO_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image starts on an empty workspace, runs, caches and stays healthy
        run: |
          mkdir -p ws
          docker run -d --name studio -p 127.0.0.1:8080:8080 -v "$PWD/ws:/workspace" qkt-backtester:release
          scripts/docker-smoke.sh http://127.0.0.1:8080
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' qkt-backtester:release)" = "$VERSION"
      - name: push :vX.Y.Z, :vX.Y, :latest and :sha-<commit>
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "v$VERSION" "v$MINOR" latest "sha-$SHORT"; do
            docker tag qkt-backtester:release "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "Pushed $IMAGE:v$VERSION ($(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:v$VERSION"))" >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub release with the image reference
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          DIGEST=$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:v$VERSION")
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "qkt-backtester v$VERSION" \
            --notes "Image: \`$IMAGE:v$VERSION\` (\`$DIGEST\`). How to run it: docs/production.md" || true
      - name: container logs
        if: always()
        run: docker logs studio || true
