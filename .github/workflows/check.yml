name: check
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Tests that need a real qkt binary and data store skip themselves when they are absent.
      - run: pnpm -r test
